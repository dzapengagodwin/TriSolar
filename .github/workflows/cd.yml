name: LaptopZone CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 30m
          envs: GH_TOKEN
          script: |
            set -e
            set +x

            cd /root/my-medusa-store

            if [ -z "${GH_TOKEN:-}" ]; then
              echo "ERROR: GH_TOKEN was not passed to the VPS"
              exit 1
            fi

            echo "=== Updating source ==="

            git remote set-url origin \
              https://github.com/Cloudworxzw/laptopzone-medusa.git

            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)" \
              fetch origin main

            git reset --hard origin/main

            echo "=== Installing dependencies ==="
            npm ci

            echo "=== Building applications ==="
            npm run build

            echo "=== Restarting Medusa ==="
            sudo systemctl restart medusa

            echo "=== Restarting Storefront ==="
            sudo systemctl restart laptopzone-storefront

            echo "=== Checking services ==="
            sudo systemctl is-active --quiet medusa
            sudo systemctl is-active --quiet laptopzone-storefront

            echo "=== Deployment successful ==="
