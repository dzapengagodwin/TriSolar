name: LaptopZone CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        with:
          # Keep your existing host, username and SSH key settings.
          envs: GH_TOKEN
          script: |
            set -e
            cd /root/my-medusa-store

            echo "=== Updating source ==="
            git remote set-url origin https://github.com/Cloudworxzw/laptopzone-medusa.git

            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)" fetch origin main

            git reset --hard origin/main

            echo "=== Installing dependencies ==="
            npm ci

            echo "=== Building applications ==="
            npm run build

            echo "=== Restarting Medusa ==="
            sudo systemctl restart medusa

            echo "=== Restarting Storefront ==="
            sudo systemctl restart laptopzone-storefront

            echo "=== Checking services ==="
            sudo systemctl is-active --quiet medusa
            sudo systemctl is-active --quiet laptopzone-storefront

            echo "=== Deployment successful ==="
